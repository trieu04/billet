server {
  listen 6700;
  server_name _;
  absolute_redirect off;

  location /api {
    proxy_pass http://server:6701;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 16m;
  }

  location = /expo {
    return 308 /expo/;
  }

  location /expo/ {
    proxy_pass http://expo:6703/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /expo;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Forwarded "host=$host;proto=$scheme";
    proxy_read_timeout 86400;
  }

  # Expo Go and Expo Router derive some Metro URLs from debuggerHost, which
  # does not support a path prefix. Keep these root endpoints on the bundler
  # while the application itself remains mounted at /expo/.
  location = /hot {
    proxy_pass http://expo:6703;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
  }

  location ~ \.bundle$ {
    proxy_pass http://expo:6703;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
  }

  location = /assets {
    proxy_pass http://expo:6703;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location = /assets/ {
    proxy_pass http://expo:6703;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /docs {
    proxy_pass http://server:6701;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws {
    proxy_pass http://server:6701;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
  }

  location / {
    proxy_pass http://web:6702;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
