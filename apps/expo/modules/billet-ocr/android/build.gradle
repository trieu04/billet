plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.billet.ocr'
version = '0.1.0'

expoModule {
  v2 true
}

android {
  namespace "app.billet.ocr"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // ML Kit Text Recognition v2, Latin script, with the model bundled in the app.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
