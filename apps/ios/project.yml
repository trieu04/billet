name: Billet
options:
  bundleIdPrefix: vn.devt
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: vi
  xcodeVersion: '27.0'
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: '5.10'
    SWIFT_STRICT_CONCURRENCY: minimal
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
targets:
  Billet:
    type: application
    platform: iOS
    sources:
      - path: Billet
    info:
      path: Billet/Supporting/Info.plist
      properties:
        API_BASE_URL: $(API_BASE_URL)
        CFBundleDisplayName: Billet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.finance
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: Billet cần camera để chụp hóa đơn và khoảnh khắc chi tiêu.
        NSPhotoLibraryUsageDescription: Billet cần quyền truy cập ảnh để thêm ảnh vào nhật ký chi tiêu.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.devt.billet
        PRODUCT_NAME: Billet
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: '1'
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - BilletTests
        - BilletUITests
  BilletTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BilletTests
    dependencies:
      - target: Billet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.devt.billet.tests
        GENERATE_INFOPLIST_FILE: YES
  BilletUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BilletUITests
    dependencies:
      - target: Billet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.devt.billet.ui-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Billet
