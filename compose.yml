services:
  gateway:
    build:
      context: .
      dockerfile: infra/gateway/Dockerfile
    depends_on:
      - server
      - web
      - mobile
    ports:
      - '${PUBLISHED_GATEWAY_PORT:-}:6700'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:6700/health']
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: billet
      POSTGRES_PASSWORD: billet
      POSTGRES_USER: billet
    ports:
      - '${PUBLISHED_POSTGRES_PORT:-}:5432'
    volumes:
      - billet-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U billet -d billet']
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file:
      - ./apps/server/.env
    environment:
      NODE_ENV: production
      PORT: 6701
      DB_HOST: postgres
      DB_PORT: 5432
      OBJECT_STORAGE_PATH: /data/private
    depends_on:
      - postgres
    ports:
      - '${PUBLISHED_API_PORT:-}:6701'
    volumes:
      - billet-storage:/data/private
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:6701/api/v1/health']
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      secrets:
        - source: web_env
          target: web_env
    ports:
      - '${PUBLISHED_WEB_PORT:-}:6702'

  mobile:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
    env_file:
      - ./apps/mobile/.env
    environment:
      NODE_ENV: production
    depends_on:
      - server
    ports:
      - '${PUBLISHED_EXPO_PORT:-}:6703'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:6703/status']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  billet-postgres:
  billet-storage:

secrets:
  web_env:
    file: ./apps/web/.env
