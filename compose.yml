services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 6700
      CORS_ORIGIN: http://localhost:6701
    ports:
      - '6700:6700'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:6700/api/v1/health']
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:6700/api/v1
    depends_on:
      server:
        condition: service_healthy
    ports:
      - '6701:6701'
