services:
  gateway:
    build:
      context: .
      dockerfile: infra/gateway/Dockerfile
    depends_on:
      - server
      - web
      - expo
    ports:
      - '${COMPOSE_GATEWAY_HOST_PORT:-}:6700'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:6700/health']
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: billet
      POSTGRES_PASSWORD: billet
      POSTGRES_USER: billet
    ports:
      - '${COMPOSE_POSTGRES_HOST_PORT:-}:5432'
    volumes:
      - billet-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U billet -d billet']
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file:
      - ./apps/server/.env
    environment:
      NODE_ENV: production
      SERVER_PORT: 6701
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      LOCAL_OBJECT_STORAGE_DIRECTORY: /data/private
    depends_on:
      - postgres
    ports:
      - '${COMPOSE_SERVER_HOST_PORT:-}:6701'
    volumes:
      - billet-storage:/data/private
      - ./keys:/keys:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:6701/api/v1/health']
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      secrets:
        - source: web_env
          target: web_env
    ports:
      - '${COMPOSE_WEB_HOST_PORT:-}:6702'

  expo:
    build:
      context: .
      dockerfile: apps/expo/Dockerfile
    env_file:
      - ./apps/expo/.env
    environment:
      NODE_ENV: production
    depends_on:
      - server
    ports:
      - '${COMPOSE_EXPO_HOST_PORT:-}:6703'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:6703/status']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  billet-postgres:
  billet-storage:

secrets:
  web_env:
    file: ./apps/web/.env
