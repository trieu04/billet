# Postgres for local development.
# Runs on host port 5433 so it won't clash with a system Postgres on 5432.
services:
  db:
    image: postgres:16-alpine
    container_name: locket-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: locket
      POSTGRES_PASSWORD: locket
      POSTGRES_DB: locket
    ports:
      - "5439:5432"
    volumes:
      - locket-db-data:/var/lib/postgresql/data

volumes:
  locket-db-data:
