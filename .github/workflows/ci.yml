name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect component changes
    runs-on: ubuntu-latest
    outputs:
      common: ${{ steps.filter.outputs.common }}
      release: ${{ steps.filter.outputs.release }}
      workspace: ${{ steps.filter.outputs.workspace }}
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
      expo: ${{ steps.filter.outputs.expo }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            common:
              - '.github/workflows/ci.yml'
              - 'scripts/**'
            release:
              - '.changeset/**'
              - 'scripts/**'
              - 'apps/*/package.json'
            workspace:
              - '.npmrc'
              - '.oxfmtignore'
              - '.oxfmtrc.json'
              - '.oxlintrc.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            server:
              - 'apps/server/**'
            web:
              - 'apps/web/**'
            expo:
              - 'apps/expo/**'

  validate-common:
    name: Validate shared repository
    needs: changes
    if: needs.changes.outputs.common == 'true' || needs.changes.outputs.release == 'true' || needs.changes.outputs.workspace == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.common == 'true' || needs.changes.outputs.workspace == 'true'
        run: pnpm format:check
      - name: Ensure the main ref is available to Changesets
        if: (needs.changes.outputs.release == 'true' || needs.changes.outputs.workspace == 'true') && github.head_ref != 'changeset-release/main' && github.ref_name != 'changeset-release/main'
        run: git show-ref --verify --quiet refs/heads/main || git branch main origin/main
      - name: Validate release metadata
        if: (needs.changes.outputs.release == 'true' || needs.changes.outputs.workspace == 'true') && github.head_ref != 'changeset-release/main' && github.ref_name != 'changeset-release/main'
        run: pnpm release:check

  validate-server:
    name: Validate server
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.workspace == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec oxfmt --check apps/server
      - run: pnpm --filter @billet/server lint
      - run: pnpm --filter @billet/server typecheck
      - run: pnpm --filter @billet/server test
      - run: pnpm --filter @billet/server build

  validate-web:
    name: Validate web
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.workspace == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec oxfmt --check apps/web
      - run: pnpm --filter @billet/web lint
      - run: pnpm --filter @billet/web typecheck
      - run: pnpm --filter @billet/web test
      - run: pnpm --filter @billet/web build

  validate-expo:
    name: Validate Expo
    needs: changes
    if: needs.changes.outputs.expo == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/expo
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/expo/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
